<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Sales Tracker</h1>
        </div>
    </header>

    <main class="container">
        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Sales</h3>
                <p id="totalSales">₦0.00</p>
            </div>
            <div class="card">
                <h3>Total Count</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="card">
                <h3>Average Sale</h3>
                <p id="avgSale">₦0.00</p>
            </div>
            <div class="card">
                <h3>Pending</h3>
                <p id="pendingCount">0</p>
            </div>
        </section>

        <!-- Controls -->
        <section class="controls">
            <button id="addSaleBtn" class="btn btn-primary">+ Add Sale</button>
            <input type="text" id="searchInput" placeholder="Search by customer or product...">
            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="Completed">Completed</option>
                <option value="Pending">Pending</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </section>

        <!-- Sales Table -->
        <section class="table-container">
            <table id="salesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Product/Service</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="salesBody">
                    <!-- Sales rows will be inserted here -->
                </tbody>
            </table>
            <p id="noSales" class="no-data">No sales recorded yet. Click "Add Sale" to get started!</p>
        </section>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Sale</h2>
            <form id="saleForm">
                <input type="hidden" id="saleId">
                <div class="form-group">
                    <label for="saleDate">Date</label>
                    <input type="date" id="saleDate" required>
                </div>
                <div class="form-group">
                    <label for="customer">Customer</label>
                    <input type="text" id="customer" placeholder="Customer name" required>
                </div>
                <div class="form-group">
                    <label for="product">Product/Service</label>
                    <input type="text" id="product" placeholder="Product or service name" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (₦)</label>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="Completed">Completed</option>
                        <option value="Pending">Pending</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
